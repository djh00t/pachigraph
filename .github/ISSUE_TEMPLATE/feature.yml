name: "Feature or improvement"
description: "Propose an observable improvement"
title: "feat: "
body:
  - type: markdown
    attributes:
      value: "## Feature or improvement\nPropose an observable improvement. Use the acceptance checklist to make the issue reviewable."
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: "Describe who benefits, the intended outcome, and what is in scope."
      placeholder: "An operator can locate a retained trace by its stable identifier."
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: "Describe the intended result and any scope limits."
      placeholder: "An operator can locate a retained trace by its stable identifier."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance checklist
      description: "Write observable results a reviewer can verify."
      placeholder: "- [ ] A reviewer can reproduce the expected result."
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Evidence and verification
      description: "Provide reproduction steps, safe evidence links, or an exact verification command."
      placeholder: "Run the relevant offline check and state the expected result."
    validations:
      required: true
  - type: textarea
    id: rollout
    attributes:
      label: Dependencies and rollout
      description: "Link dependencies or blockers. Include migration and rollback details when applicable."
      placeholder: "Related issue, deployment order, or rollback steps."
    validations:
      required: false
