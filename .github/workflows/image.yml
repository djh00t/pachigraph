name: image
on:
  push:
    branches: [main, "codex/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    uses: ./.github/workflows/check.yml
  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v7.3.0
        id: image
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/djh00t/pachigraph:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/djh00t/pachigraph
      - name: Record immutable image reference
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: echo "ghcr.io/djh00t/pachigraph@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
